# ================================================================================
# DCLS CVA6 CI - Tier 2: Daily Verilator Regression (Version 2)
# ================================================================================
#
# Base workflow:
#   Derived from the reviewed OpenHW tier-2 workflow for CVA6, then adapted for
#   the rigoletto-devel integration branch.
#
# DCLS overlay:
#   - Preserve DCLS smoke coverage on rv32 targets via smoke-tests-dcls
#   - Preserve dcls-custom-tests as the current dedicated DCLS regression entry
#   - Keep the upstream RV32/RV64 curated regression matrix for alignment with
#     the latest OpenHW CI policy
# ================================================================================

name: dcls-ci-tier2-v2

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: dcls-ci-tier2-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  SPIKE_TANDEM: 1
  NUM_JOBS: 8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup-tools:
    name: Setup Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env
        with:
          install-tools: "true"

  execute-rv32-tier2:
    name: ${{ matrix.testcase }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: setup-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----------------------------------------------------------
          # OpenHW reviewed baseline jobs: cv32a65x
          # ----------------------------------------------------------
          - config: cv32a65x
            testcase: smoke-tests-cv32a65x
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: cv32a6_tests
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: dv-riscv-arch-test
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-arch-test
            testlist: "../tests/testlist_riscv-arch-test-cv32a65x.yaml"
            test_name: ""
            linker: "../tests/riscv-arch-test/riscv-target/spike/link.ld"
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: dv-riscv-tests-p
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: "../tests/testlist_riscv-tests-cv32a65x-p.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: dv-riscv-compliance
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-compliance
            testlist: "../tests/testlist_riscv-compliance-cv32a65x.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: dv-riscv-csr-access-test
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: dv-csr-embedded-tests
            mode: script
            simulator: veri-testharness
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: hwconfig_tests
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: cv32a65x

          - config: cv32a65x
            testcase: coremark
            mode: script
            simulator: veri-testharness
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: cv32a65x

          - config: cv32a65x
            testcase: benchmark
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          # ----------------------------------------------------------
          # OpenHW reviewed baseline jobs: cv32a60x
          # ----------------------------------------------------------
          - config: cv32a60x
            testcase: cv32a6_tests
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: dv-riscv-arch-test
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-arch-test
            testlist: "../tests/testlist_riscv-arch-test-cv32a60x.yaml"
            test_name: ""
            linker: "../tests/riscv-arch-test/riscv-target/spike/link.ld"
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: dv-riscv-tests-p
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: "../tests/testlist_riscv-tests-cv32a60x-p.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: dv-riscv-compliance
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-compliance
            testlist: "../tests/testlist_riscv-compliance-cv32a60x.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: dv-riscv-csr-access-test
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: benchmark
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          # ----------------------------------------------------------
          # DCLS overlay jobs
          # ----------------------------------------------------------
          - config: cv32a60x
            testcase: smoke-tests-dcls
            mode: script
            script_runner: source
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a65x
            testcase: smoke-tests-dcls
            mode: script
            script_runner: source
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv32a60x
            testcase: dcls-custom-tests
            mode: script
            script_runner: source
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env

      - name: Install prerequisites
        run: source ci/install-prereq.sh

      - name: Run Tier 2 for ${{ matrix.config }} / ${{ matrix.testcase }}
        run: |
          set -x
          mkdir -p ci-results
          echo "1" > ci-results/exit_code
          source verif/sim/setup-env.sh
          rc=0

          if [ "${{ matrix.mode }}" = "testlist" ]; then
            if [[ "${{ matrix.simulator }}" == *"veri-testharness"* ]]; then
              source verif/regress/install-verilator.sh
            fi
            source verif/regress/install-spike.sh
            if [ -n "${{ matrix.install_script }}" ]; then
              source verif/regress/${{ matrix.install_script }}.sh
            fi
            LINKER_OPT=""
            if [ -n "${{ matrix.linker }}" ]; then
              LINKER_OPT="--linker=${{ matrix.linker }}"
            fi
            TEST_OPT=""
            if [ -n "${{ matrix.test_name }}" ]; then
              TEST_OPT="--test ${{ matrix.test_name }}"
            fi
            cd verif/sim
            python3 cva6.py \
              --testlist=${{ matrix.testlist }} \
              --target ${{ matrix.config }} \
              --iss_yaml=cva6.yaml \
              --iss=${{ matrix.simulator }} \
              --issrun_opts="+tb_performance_mode+debug_disable=1+UVM_VERBOSITY=UVM_NONE" \
              $LINKER_OPT \
              ${TEST_OPT} \
              || rc=$?
            cd -
          else
            if [ -n "${{ matrix.hwconfig_opts }}" ]; then
              export DV_HWCONFIG_OPTS="${{ matrix.hwconfig_opts }}"
            fi
            export DV_SIMULATORS=${{ matrix.simulator }}
            export DV_TARGET=${{ matrix.config }}
            SCRIPT_RUNNER="${{ matrix.script_runner || 'bash' }}"
            if [ "$SCRIPT_RUNNER" = "source" ]; then
              source verif/regress/${{ matrix.testcase }}.sh || rc=$?
            else
              bash verif/regress/${{ matrix.testcase }}.sh || rc=$?
            fi
          fi

          echo "$rc" > ci-results/exit_code
          find verif/sim -name "iss_regr.log" -exec cp {} ci-results/ \; 2>/dev/null || true
          exit $rc

      - name: Collect simulation logs
        if: always()
        run: |
          SIM_OUT=$(ls -dt verif/sim/out_*/ 2>/dev/null | head -1)
          if [ -n "$SIM_OUT" ]; then
            [ -f "${SIM_OUT}iss_regr.log" ] && cp "${SIM_OUT}iss_regr.log" ci-results/iss_regr.log
            mkdir -p ci-results/spike_sim
            find "${SIM_OUT}spike_sim/" -maxdepth 1 \
              \( -name "*.log" -o -name "*.log.iss" -o -name "*.csv" \) \
              -exec cp {} ci-results/spike_sim/ \; 2>/dev/null || true
            mkdir -p ci-results/veri-testharness_sim
            find "${SIM_OUT}veri-testharness_sim/" -maxdepth 1 \
              \( -name "*.log" -o -name "*.log.iss" -o -name "*.csv" -o -name "*.log.yaml" \) \
              -exec cp {} ci-results/veri-testharness_sim/ \; 2>/dev/null || true
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-rv32-${{ matrix.config }}-${{ matrix.testcase }}
          path: ci-results/
          retention-days: 14

  execute-rv64-tier2:
    name: ${{ matrix.testcase }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: setup-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: cv64a6_imafdc_tests
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: dv-riscv-arch-test
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-arch-test
            testlist: "../tests/testlist_riscv-arch-test-cv64a6_imafdc_sv39.yaml"
            test_name: ""
            linker: "../tests/riscv-arch-test/riscv-target/spike/link.ld"
            hwconfig_opts: ""

          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: dv-riscv-tests-v
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: "../tests/testlist_riscv-tests-cv64a6_imafdc_sv39-v.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: dv-riscv-tests-p
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-tests
            testlist: "../tests/testlist_riscv-tests-cv64a6_imafdc_sv39-p.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: dv-riscv-compliance
            mode: testlist
            simulator: veri-testharness,spike
            install_script: install-riscv-compliance
            testlist: "../tests/testlist_riscv-compliance-cv64a6_imafdc_sv39.yaml"
            test_name: ""
            linker: ""
            hwconfig_opts: ""

          - config: cv64a6_imafdc_sv39_hpdcache_wb
            testcase: benchmark
            mode: script
            simulator: veri-testharness,spike
            install_script: ""
            testlist: ""
            test_name: ""
            linker: ""
            hwconfig_opts: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CVA6 Environment
        uses: ./.github/actions/setup-cva6-env

      - name: Install prerequisites
        run: source ci/install-prereq.sh

      - name: Run Tier 2 for ${{ matrix.config }} / ${{ matrix.testcase }}
        run: |
          set -x
          mkdir -p ci-results
          echo "1" > ci-results/exit_code
          source verif/sim/setup-env.sh
          rc=0

          if [ "${{ matrix.mode }}" = "testlist" ]; then
            if [[ "${{ matrix.simulator }}" == *"veri-testharness"* ]]; then
              source verif/regress/install-verilator.sh
            fi
            source verif/regress/install-spike.sh
            if [ -n "${{ matrix.install_script }}" ]; then
              source verif/regress/${{ matrix.install_script }}.sh
            fi
            LINKER_OPT=""
            if [ -n "${{ matrix.linker }}" ]; then
              LINKER_OPT="--linker=${{ matrix.linker }}"
            fi
            TEST_OPT=""
            if [ -n "${{ matrix.test_name }}" ]; then
              TEST_OPT="--test ${{ matrix.test_name }}"
            fi
            cd verif/sim
            python3 cva6.py \
              --testlist=${{ matrix.testlist }} \
              --target ${{ matrix.config }} \
              --iss_yaml=cva6.yaml \
              --iss=${{ matrix.simulator }} \
              --issrun_opts="+tb_performance_mode+debug_disable=1+UVM_VERBOSITY=UVM_NONE" \
              $LINKER_OPT \
              ${TEST_OPT} \
              || rc=$?
            cd -
          else
            if [ -n "${{ matrix.hwconfig_opts }}" ]; then
